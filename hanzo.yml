# Hanzo CI — the ONE way this repo is gated, read by hanzoai/ci.
#
# No `images:` and no `deploy:`: this is a client library. A consumer installs it
# from Packagist at a tag, so what CI owes is a gate, not an artifact.

test:
  - name: build
    # `php -l` is the compiler this language has: it parses every file and
    # refuses a redeclaration, which is exactly how the four name collisions in
    # the document announce themselves. `--strict-psr` is the other half — it
    # fails when a class does not sit in the file PSR-4 says it does, which no
    # parse can see and which would only surface as "class not found" in a
    # consumer's application.
    run: |
      set -e
      export PATH="$HOME/.local/bin:$PATH"
      if ! command -v php >/dev/null 2>&1 || ! php -m | grep -qi '^curl$' || ! php -m | grep -qi '^mbstring$'; then
        if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq php-cli php-curl php-mbstring php-xml unzip
        else
          tmp="${RUNNER_TEMP:-/tmp}/php-sysroot"
          apt="$tmp/apt"; debs="$tmp/debs"; root="$tmp/root"
          mkdir -p "$apt/lists/partial" "$apt/cache/archives/partial" "$debs" "$root"
          aptopt=(-o Dir::State::Lists="$apt/lists" -o Dir::Cache="$apt/cache" -o Dir::State::status=/var/lib/dpkg/status -o Debug::NoLocking=1 -o APT::Sandbox::User=)
          apt-get "${aptopt[@]}" update -qq
          all=$(apt-cache "${aptopt[@]}" depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances php-cli php-curl php-mbstring php-xml unzip | grep -E '^[a-z0-9]' | sort -u)
          missing=""
          for p in $all; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          [ -z "$missing" ] || (cd "$debs" && apt-get "${aptopt[@]}" download -q $missing && for d in "$debs"/*.deb; do dpkg -x "$d" "$root"; done)
          triple=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || echo x86_64-linux-gnu)
          phpbin=$(ls "$root/usr/bin"/php[0-9]* 2>/dev/null | head -1 || true)
          [ -n "$phpbin" ] && ln -sf "$phpbin" "$root/usr/bin/php"
          extdir=$(find "$root/usr/lib/php" -maxdepth 1 -type d -name '20*' 2>/dev/null | head -1 || true)
          conf="$tmp/conf.d"; mkdir -p "$conf"
          find "$root/usr/share" "$root/etc/php" -name '*.ini' -type f 2>/dev/null | while read -r f; do
            b=$(basename "$f")
            [ "$b" = "php.ini" ] && continue
            prio=$(awk -F= '/^;[[:space:]]*priority=/{gsub(/[[:space:]]/,"",$2); print $2; exit}' "$f")
            cp "$f" "$conf/${prio:-20}-$b"
          done
          mkdir -p "$HOME/.local/bin"
          {
            echo '#!/bin/sh'
            echo "export LD_LIBRARY_PATH=\"$root/usr/lib/$triple:$root/lib/$triple\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\""
            echo "export PHP_INI_SCAN_DIR=\"$conf\""
            echo "exec \"$root/usr/bin/php\" ${extdir:+-d extension_dir=\"$extdir\"} \"\$@\""
          } > "$HOME/.local/bin/php"
          chmod +x "$HOME/.local/bin/php"
          export PATH="$HOME/.local/bin:$root/usr/bin:$PATH"
        fi
      fi
      if ! command -v composer >/dev/null 2>&1; then
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://getcomposer.org/download/latest-stable/composer.phar -o "$HOME/.local/bin/composer"
        chmod +x "$HOME/.local/bin/composer"
      fi
      composer install --no-interaction --no-progress
      composer validate --strict --no-check-lock
      find src examples -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
      composer dump-autoload --optimize --strict-psr

  - name: readme
    # The API classes the README names are ones src/Api has.
    run: ./scripts/readme

  - name: examples
    # The one flow that needs no credential, run for real against the API. It
    # proves the whole path a consumer takes — autoload, Configuration, the
    # request the client builds, a 200 back — which linting cannot.
    run: PATH="$HOME/.local/bin:$PATH" php examples/models.php

# THE CLIENT LANE — this repo is a PROJECTION of one API document at one version.
#
# hanzoai/cloud's release sends `repository_dispatch: spec-update` carrying
# (version, sha, spec_sha256); hanzoai/ci fetches openapi.yaml AT THAT SHA,
# REFUSES if the bytes hash to anything else, runs `generate:`, writes
# `.spec-lock` beside the code, and — only after `test:` above has passed over
# exactly those bytes — commits.
#
# NO version: — Packagist reads a release from a git TAG, so this client has no
# version field for the lane to bump. Its projection still lands and is still
# gated; the tag waits for a human.
client:
  generate: ./scripts/generate.sh
